# The private headless sway the VM's window opens in (container/display-up.sh). The output's
# size follows the Mac's screen; the window fills it, one guest pixel per output pixel.
output HEADLESS-1 mode 1920x1080@60Hz position 0 0 bg #000000 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
for_window [title=".*"] fullscreen enable
xwayland disable
